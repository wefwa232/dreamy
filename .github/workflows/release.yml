# Publishes a Dreamy release when a version tag such as v0.1.1 is pushed.
# It builds the Windows installer, signs the updater package, and publishes the
# GitHub Release together with latest.json. Installed copies of Dreamy read
# latest.json to find updates. See docs/releasing.md for the full procedure.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One release at a time. A release already running is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Check the tag is a plain version and matches every version file
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Only plain versions are released. A suffix such as -beta is refused, so no unfinished build reaches installed copies.
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $GITHUB_REF_NAME is not a plain version such as v0.1.2. Nothing was published."
            exit 1
          fi
          # Checks package.json, package-lock.json (both entries), tauri.conf.json, Cargo.toml and Cargo.lock
          if ! node scripts/bump-version.js --check "$tag"; then
            echo "The version files do not all match the tag $GITHUB_REF_NAME. Fix them with npm run bump, then tag again."
            exit 1
          fi

      - name: Refuse a version that is not newer than the latest stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new="${GITHUB_REF_NAME#v}"
          # "gh release view" with no tag shows the latest stable release (never a draft or pre-release)
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          latest="${latest#v}"
          if [ -n "$latest" ]; then
            highest=$(printf '%s\n%s\n' "$latest" "$new" | sort -V | tail -n1)
            echo "latest stable=$latest new=$new"
            if [ "$new" = "$latest" ] || [ "$highest" != "$new" ]; then
              echo "Version $new is not newer than the latest stable release $latest. Installed copies would not update to it."
              exit 1
            fi
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Every check must pass before anything is built, signed or published. A failed
      # step stops the job here, so the signing key is never used for a failing build.
      - name: Run the checks
        shell: bash
        run: |
          node --check src/app.js
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build, sign and publish the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dreamy ${{ github.ref_name }}"
          releaseBody: "Installed copies of Dreamy update to this version automatically. Your dreams and tag library are not changed by an update."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json
